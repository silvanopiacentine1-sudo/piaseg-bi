      <th class="n" data-k="nr">Não renovadas</th><th class="n" data-k="ca">Canceladas</th><th class="n" data-k="com">Comissões ${ANO}</th><th class="n" data-k="sin">Sinistros pagos</th></tr></thead><tbody></tbody></table></div></div>`;
  document.querySelector("#aba section").insertAdjacentHTML("beforeend", cards + tabela);
  const val = {f: x => x.f, pos: x => x.camp ? x.camp.posicao : 999, real: x => x.camp ? x.camp.realizado_2026 : -1, conv: x => x.conv && x.conv.cot ? x.conv.ef / x.conv.cot : -1,
               nr: x => x.nr ? x.nr.premio : -1, ca: x => x.ca ? x.ca.premio : -1, com: x => x.com ? x.com.v26 : -1e12, sin: x => x.sin ? x.sin.total : -1};
  let ord = "real", asc = false;
  const desenhar = () => {
    const l = lin.slice().sort((a, b) => { const va = val[ord](a), vb = val[ord](b); return (va < vb ? -1 : va > vb ? 1 : 0) * (asc ? 1 : -1); });
    document.querySelector("#tb-geral tbody").innerHTML = l.map(x => `<tr><td>${esc(x.f)}</td>
      <td class="n">${c(x.camp, m => `<b>${m.posicao}º</b> <span style="color:var(--muted)">de ${m.participantes}</span>`)}</td>
      <td class="n">${c(x.camp, m => brl0(m.realizado_2026))}</td>
      <td class="n">${c(x.conv, m => m.cot ? pct(m.ef / m.cot) : "—")}</td>
      <td class="n">${c(x.nr, m => `${int(m.qtd)} · ${brl0(m.premio)}`)}</td>
      <td class="n">${c(x.ca, m => `${int(m.qtd)} · ${brl0(m.premio)}`)}</td>
      <td class="n">${c(x.com, m => `${brl0(m.v26)} ${indicador(m.v25, m.v26)}`)}</td>
      <td class="n">${c(x.sin, m => brl0(m.total))}</td></tr>`).join("");
  };
  document.querySelectorAll("#tb-geral th").forEach(th => { th.style.cursor = "pointer"; th.onclick = () => {
    const k = th.dataset.k; asc = ord === k ? !asc : (k === "f" || k === "pos"); ord = k; desenhar(); }; });
  desenhar();
}

/* ---------------------------------------------------------------- registro de acessos (só gestor) */

let FILTRO_ACESSO = {unidade: "", dias: 30};

async function abaAcessos() {
  document.querySelectorAll("nav.abas a").forEach(l => l.classList.remove("ativo"));
  const el = document.getElementById("conteudo");
  el.innerHTML = `<div class="vazio">Carregando acessos…</div>`;
  let r;
  try { r = await api(`/api/admin/acessos?dias=${FILTRO_ACESSO.dias}`); }
  catch (e) { el.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; return; }
  const data = iso => new Date(iso).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit", year: "2-digit"});
  const hora = iso => new Date(iso).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
  const dur = (a, b) => { const m = Math.max(1, Math.round((new Date(b) - new Date(a)) / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`; };
  const unidadesDe = v => v.unidades.split("; ").filter(Boolean);
  const todasUnidades = ["Gestor", ...r.unidades];
  const visitas = r.visitas.filter(v => !FILTRO_ACESSO.unidade || unidadesDe(v).includes(FILTRO_ACESSO.unidade));

  // resumo por unidade: quem acessou e quem não acessou no período
  const resumo = r.unidades.map(u => {
    const vs = r.visitas.filter(v => unidadesDe(v).includes(u));
    const minutos = vs.reduce((a, v) => a + Math.max(1, Math.round((new Date(v.saida) - new Date(v.entrada)) / 60000)), 0);
    return {u, n: vs.length, ultimo: vs[0] ? vs[0].entrada : null, minutos};
  }).sort((a, b) => (b.ultimo || "").localeCompare(a.ultimo || "") || a.u.localeCompare(b.u));
  const semAcesso = resumo.filter(x => !x.n).length;

  el.innerHTML = `<div class="unidade"><h2>Registro de acessos</h2><span class="pill" style="background:var(--gold);color:var(--navy)">visão do gestor</span></div>
  <section>
    <div class="sec-tit"><span class="barra"></span><h3>Quem está usando o BI</h3>
      <div class="filtro"><label for="f-uni">Unidade</label><select id="f-uni"><option value="">Todas as unidades</option>
        ${todasUnidades.map(u => `<option ${u === FILTRO_ACESSO.unidade ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>
        <label for="f-dias">Período</label><select id="f-dias">${[7, 30, 90, 365].map(d => `<option value="${d}" ${d === FILTRO_ACESSO.dias ? "selected" : ""}>últimos ${d} dias</option>`).join("")}</select></div>
      <span class="nota">Entrada = login (ou retorno à página depois de ${30} min sem uso). Saída = clique em "Sair" ou, se a página foi apenas fechada, o último sinal dela (precisão de cerca de 2 min).</span></div>
    ${FILTRO_ACESSO.unidade ? "" : `<div class="grid g3" style="margin-bottom:14px">
      ${kpi("Acessos no período", int(r.visitas.length), `últimos ${FILTRO_ACESSO.dias} dias`, true)}
      ${kpi("Unidades que acessaram", `${int(resumo.length - semAcesso)} de ${int(resumo.length)}`, "unidades com login vinculado")}
      ${kpi("Unidades sem acesso", int(semAcesso), semAcesso ? "veja a lista abaixo" : "todas acessaram")}
    </div>
    <div class="card" style="margin-bottom:14px"><h4>Por unidade <small>— últimos ${FILTRO_ACESSO.dias} dias</small></h4><div class="tbl-wrap" style="max-height:360px"><table>
      <thead><tr><th>Unidade</th><th class="n">Último acesso</th><th class="n">Acessos</th><th class="n">Tempo total</th></tr></thead><tbody>
      ${resumo.map(x => `<tr><td>${esc(x.u)}</td><td class="n">${x.ultimo ? `${data(x.ultimo)} ${hora(x.ultimo)}` : `<span class="ind ind-down">nunca acessou</span>`}</td>
        <td class="n">${int(x.n)}</td><td class="n">${x.n ? (x.minutos < 60 ? x.minutos + " min" : Math.floor(x.minutos / 60) + " h " + String(x.minutos % 60).padStart(2, "0") + " min") : "—"}</td></tr>`).join("")}
      </tbody></table></div></div>`}
    <div class="card"><h4>Acessos${FILTRO_ACESSO.unidade ? " — " + esc(FILTRO_ACESSO.unidade) : ""} <small>— ${int(visitas.length)} no período</small></h4>
      <div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th>Data</th><th>Usuário</th><th>Unidade</th><th class="n">Entrada</th><th class="n">Saída</th><th class="n">Duração</th></tr></thead><tbody>
      ${visitas.map(v => `<tr><td>${data(v.entrada)}</td><td>${esc(v.nome)}<div class="qtd">${esc(v.usuario)}</div></td><td>${esc(v.unidades || "—")}</td>
        <td class="n">${hora(v.entrada)}</td><td class="n">${hora(v.saida)}${v.saiu_pelo_botao ? "" : `<div class="qtd">último sinal</div>`}</td><td class="n">${dur(v.entrada, v.saida)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="vazio">Nenhum acesso no período.</td></tr>`}
      </tbody></table></div></div>
  </section>
  <div class="footer">BI Piaseg</div>`;
  document.getElementById("f-uni").onchange = e => { FILTRO_ACESSO.unidade = e.target.value; abaAcessos(); };
  document.getElementById("f-dias").onchange = e => { FILTRO_ACESSO.dias = +e.target.value; abaAcessos(); };
}

/* sinal de presença: na entrada e a cada 2 min com a página visível (é o que define a hora de saída) */
let _timerSinal = null;
function iniciarSinais() {
  const sinal = () => { if (TOKEN && document.visibilityState === "visible") api("/api/acesso/sinal", {method: "POST"}).catch(() => {}); };
  sinal();
  clearInterval(_timerSinal);
  _timerSinal = setInterval(sinal, 120000);
  document.addEventListener("visibilitychange", sinal);
}

/* ---------------------------------------------------------------- apólices */

function abaApolices(id) {
  const cfg = id === "canceladas"
    ? {a: D.canceladas, T: "Apólices canceladas", rotData: "Data de cancelamento", cor: COR_CANCELADAS}
    : {a: D.nao_renovadas, T: "Apólices não renovadas", rotData: "Término de vigência", cor: "#072a3c"};
  const a = cfg.a;
  if (!a.qtd) return vazio(cfg.T, "Nenhuma apólice no último relatório. 🎉");
  const sel = MES[id] || "";
  const lista = filtrarApolices(a, sel);
  const prod = {};
  lista.forEach(x => { const p = prod[x.produto] ||= {produto: x.produto, qtd: 0, premio: 0}; p.qtd++; p.premio += x.premio; });
  const produtos = Object.values(prod).sort((x, y) => y.premio - x.premio);
  const premio = somaPremio(lista);

  document.getElementById("aba").innerHTML = `<section>
    ${titulo(cfg.T, "",
             filtroMes([...a.por_mes].reverse().map(m => [m.mes, nomeMes(m.mes)]), "Todos os meses", opcoesTrim(a.por_mes.filter(m => m.mes.startsWith(String(ANO))).map(m => +m.mes.slice(5)))))}
    <div class="grid g5">
      ${kpi(sel ? rotuloPeriodo(sel) : "Total no relatório", int(lista.length), "apólices", true)}
      ${kpi("Prêmio líquido", kbrl(premio), "")}
      ${kpi("Prêmio médio", lista.length ? brl0(premio / lista.length) : "—", "por apólice")}
      ${kpi("Principal produto", produtos[0] ? `<span style="font-size:19px">${esc(produtos[0].produto)}</span>` : "—", produtos[0] ? `${int(produtos[0].qtd)} apólices · ${brl0(produtos[0].premio)}` : "")}
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h4>Prêmio líquido por mês <small>— ${cfg.rotData.toLowerCase()}</small></h4><div id="ch-apo"></div></div>
      <div class="card"><h4>Por produto / ramo</h4><div class="tbl-wrap" style="max-height:270px"><table><thead><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Prêmio</th></tr></thead><tbody>
        ${produtos.map(p => `<tr><td>${esc(p.produto)}</td><td class="n">${int(p.qtd)}</td><td class="n">${brl0(p.premio)}</td></tr>`).join("")}
      </tbody></table></div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="toolbar"><b>Apólices</b>
        <input type="search" id="f-busca" placeholder="Buscar cliente, apólice, seguradora…">
        <span id="f-tot" style="color:var(--muted);font-size:13px"></span>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>${cfg.rotData}</th>${D.todos ? "<th>Franqueado</th>" : ""}<th>Cliente</th><th>Apólice</th><th>Seguradora</th><th>Produto</th><th class="n">Prêmio líquido</th></tr></thead><tbody id="tb-apo"></tbody></table></div>
    </div>
  </section>`;
  ligarFiltro();

  barras(document.getElementById("ch-apo"), a.por_mes.map(m => mesLabel(m.mes)),
    [{nome: "Prêmio líquido", cor: cfg.cor, valores: a.por_mes.map(m => m.premio)}],
    {destaque: idxDestaque(sel, a.por_mes.map(m => +m.mes.slice(5)), a.por_mes.map(m => +m.mes.slice(0, 4))), fmt: brl0,
     fmtEixo: eixo, tipExtra: i => `${int(a.por_mes[i].qtd)} apólice(s)`});

  const fb = document.getElementById("f-busca");
  const desenhar = () => {
    const q = fb.value.trim().toLowerCase();
    const l = lista.filter(x => !q || [x.cliente, x.apolice, x.seguradora, x.produto, x.franqueado].join(" ").toLowerCase().includes(q));
    document.getElementById("tb-apo").innerHTML = l.map(x => `<tr><td>${dataBR(x.data)}</td>${D.todos ? `<td>${esc(x.franqueado)}</td>` : ""}<td>${esc(x.cliente)}</td><td>${esc(x.apolice)}</td><td>${esc(x.seguradora)}</td><td>${esc(x.produto)}</td><td class="n">${brl(x.premio)}</td></tr>`).join("")
      || `<tr><td colspan="7" class="vazio">Nada encontrado.</td></tr>`;
    document.getElementById("f-tot").textContent = `${int(l.length)} apólice(s) · ${brl0(somaPremio(l))}`;
  };
  fb.oninput = desenhar; desenhar();
}

if (TOKEN) iniciar().catch(() => sair());
</script>
